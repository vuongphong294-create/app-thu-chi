<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Thu Chi</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 15px; background: #e9ecef; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h3 { margin-top: 0; color: #333; font-size: 1.1em; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .summary { display: flex; justify-content: space-between; text-align: center; margin-bottom: 10px; }
        .summary div { flex: 1; }
        .summary div:not(:last-child) { border-right: 1px solid #eee; }
        .val-income { color: #20c997; font-weight: bold; font-size: 1.1em;}
        .val-expense { color: #ff6b6b; font-weight: bold; font-size: 1.1em;}
        .val-balance { color: #4285F4; font-weight: bold; font-size: 1.5em; margin: 5px 0 15px 0;}

        input, select, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #4285F4; color: white; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        button:active { filter: brightness(90%); }

        .history-list { max-height: 300px; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; align-items: center;}
        .history-item:last-child { border-bottom: none; }
        .item-info { display: flex; flex-direction: column; }
        .item-category { font-weight: bold; font-size: 1em; color: #333;}
        .item-note { font-size: 0.85em; color: #777; margin-top: 3px; }
        .item-date { font-size: 0.75em; color: #999; margin-top: 3px; }
        .item-amount { font-weight: bold; font-size: 1em; text-align: right; }
        .item-amount.inc { color: #20c997; }
        .item-amount.exp { color: #ff6b6b; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; width: auto; margin-left: 15px;}
        
        .chart-container { position: relative; height: 250px; width: 100%; margin-bottom: 20px;}
        .pie-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;}
    </style>
</head>
<body>

    <div class="card">
        <h3>📊 Tổng Quan</h3>
        <div style="text-align: center;">
            <div style="font-size: 0.9em; color: #666;">Số dư hiện tại</div>
            <div class="val-balance" id="lbl-balance">0 đ</div>
        </div>
        <div class="summary">
            <div>
                <div style="font-size: 0.8em; color: #666;">Tổng thu</div>
                <div class="val-income" id="lbl-income">0 đ</div>
            </div>
            <div>
                <div style="font-size: 0.8em; color: #666;">Tổng chi</div>
                <div class="val-expense" id="lbl-expense">0 đ</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📈 Biểu Đồ Thống Kê</h3>
        <div style="font-size: 0.9em; font-weight: bold; text-align: center; margin-bottom: 10px;">SỐ DƯ HÀNG THÁNG</div>
        <div class="chart-container">
            <canvas id="lineChart"></canvas>
        </div>
        <div class="pie-controls">
            <div style="font-size: 0.9em; font-weight: bold;">TỈ LỆ MỤC ĐÍCH</div>
            <select id="pieType" onchange="drawCharts()" style="width: 120px; padding: 6px; margin: 0;">
                <option value="false">Chi tiêu</option>
                <option value="true">Thu nhập</option>
            </select>
        </div>
        <div class="chart-container" style="height: 300px;">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>📝 Thêm Giao Dịch</h3>
        <select id="type" onchange="changeColor()">
            <option value="false">➖ Chi Tiêu</option>
            <option value="true">➕ Thu Nhập</option>
        </select>
        <input type="date" id="date" required>
        <input type="number" id="amount" placeholder="Số tiền (VNĐ)" required>
        <input type="text" id="category" placeholder="Mục đích (VD: Tiền ăn)" required>
        <input type="text" id="note" placeholder="Ghi chú (Tùy chọn)">
        <button id="btnSave" onclick="saveData()">LƯU GIAO DỊCH</button>
    </div>

    <div class="card">
        <h3>📜 Lịch Sử Giao Dịch</h3>
        <ul class="history-list" id="history-list">
            <li style="text-align:center; color:#999; padding:20px;">Đang tải dữ liệu...</li>
        </ul>
    </div>

    <script>
        // CẤU HÌNH FIREBASE ĐÃ CHÈN LINK CỦA BẠN
        const firebaseConfig = {
            databaseURL: "https://money-bb5f5-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('date').valueAsDate = new Date();
        let allTransactions = []; 
        let lineChartInstance = null;
        let pieChartInstance = null;

        function changeColor() {
            const isInc = document.getElementById('type').value === "true";
            document.getElementById('btnSave').style.backgroundColor = isInc ? "#20c997" : "#ff6b6b";
        }
        changeColor();

        function saveData() {
            const isIncome = document.getElementById('type').value === "true";
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            
            if (!amount || !category) { alert("Vui lòng nhập đủ số tiền và mục đích!"); return; }

            const id = Date.now(); 
            const data = {
                Id: id,
                Date: document.getElementById('date').value + "T00:00:00",
                CategoryName: category,
                Amount: amount,
                Note: document.getElementById('note').value,
                IsIncome: isIncome
            };

            db.ref('transactions/' + id).set(data)
            .then(() => {
                document.getElementById('amount').value = '';
                document.getElementById('note').value = '';
                document.getElementById('category').value = '';
            })
            .catch(error => alert("Lỗi kết nối: " + error));
        }

        function deleteItem(id) {
            if(confirm("Bạn có chắc chắn muốn xóa giao dịch này?")) {
                db.ref('transactions/' + id).remove();
            }
        }

        db.ref('transactions').on('value', (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            allTransactions = [];

            let totalIncome = 0, totalExpense = 0;
            
            if (!data) {
                listEl.innerHTML = '<li style="text-align:center; color:#999; padding:20px;">Chưa có giao dịch nào.</li>';
                updateStats(0, 0);
                drawCharts();
                return;
            }

            allTransactions = Object.keys(data).map(key => data[key]);
            const sortedForList = [...allTransactions].sort((a, b) => new Date(b.Date) - new Date(a.Date) || b.Id - a.Id);
            
            sortedForList.forEach(item => {
                if (item.IsIncome) totalIncome += item.Amount;
                else totalExpense += item.Amount;

                const dateStr = new Date(item.Date).toLocaleDateString('vi-VN');
                const amountStr = item.Amount.toLocaleString('vi-VN') + ' đ';
                const typeClass = item.IsIncome ? 'inc' : 'exp';
                const sign = item.IsIncome ? '+' : '-';

                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-category">${item.CategoryName}</span>
                        ${item.Note ? `<span class="item-note">${item.Note}</span>` : ''}
                        <span class="item-date">${dateStr}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div class="item-amount ${typeClass}">${sign}${amountStr}</div>
                        <button class="btn-delete" onclick="deleteItem('${item.Id}')">Xóa</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            updateStats(totalIncome, totalExpense);
            drawCharts(); 
        });

        function updateStats(income, expense) {
            document.getElementById('lbl-income').innerText = '+' + income.toLocaleString('vi-VN') + ' đ';
            document.getElementById('lbl-expense').innerText = '-' + expense.toLocaleString('vi-VN') + ' đ';
            document.getElementById('lbl-balance').innerText = (income - expense).toLocaleString('vi-VN') + ' đ';
        }

        function drawCharts() {
            if (allTransactions.length === 0) {
                if (lineChartInstance) lineChartInstance.destroy();
                if (pieChartInstance) pieChartInstance.destroy();
                return;
            }

            const monthlyData = {};
            allTransactions.forEach(t => {
                const d = new Date(t.Date);
                const monthKey = (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear().toString().substr(-2);
                if (!monthlyData[monthKey]) monthlyData[monthKey] = 0;
                monthlyData[monthKey] += t.IsIncome ? t.Amount : -t.Amount;
            });

            const sortedMonths = Object.keys(monthlyData).sort((a, b) => {
                const [mA, yA] = a.split('/'); const [mB, yB] = b.split('/');
                return new Date(2000+parseInt(yA), parseInt(mA)-1) - new Date(2000+parseInt(yB), parseInt(mB)-1);
            });
            const lineLabels = sortedMonths;
            const lineValues = sortedMonths.map(m => monthlyData[m]);

            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: lineLabels,
                    datasets: [{
                        label: 'Số dư',
                        data: lineValues,
                        borderColor: '#4285F4',
                        backgroundColor: 'rgba(66, 133, 244, 0.2)',
                        borderWidth: 2,
                        pointBackgroundColor: lineValues.map(v => v >= 0 ? '#20c997' : '#ff6b6b'),
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });

            const isIncomePie = document.getElementById('pieType').value === "true";
            const pieRawData = {};
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            allTransactions.forEach(t => {
                const d = new Date(t.Date);
                if (t.IsIncome === isIncomePie && d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    if (!pieRawData[t.CategoryName]) pieRawData[t.CategoryName] = 0;
                    pieRawData[t.CategoryName] += t.Amount;
                }
            });

            const pieLabels = Object.keys(pieRawData);
            const pieValues = Object.values(pieRawData);
            const pieColors = ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#AB47BC', '#FF7043', '#00ACC1', '#8D6E63'];

            if (pieChartInstance) pieChartInstance.destroy();
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            pieChartInstance = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: pieLabels,
                    datasets: [{
                        data: pieValues,
                        backgroundColor: pieColors
                    }]
                },
                options: { 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }
    </script>
</body>
</html>
